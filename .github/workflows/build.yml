name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Auto Tag"]
    types:
      - completed

permissions:
  contents: write

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install PC/SC dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pcscd libpcsclite-dev libgtk-3-dev libwebkit2gtk-4.1-dev

    - name: Install and build frontend
      run: cd frontend && npm ci && npm run build

    - name: Run tests
      run: go test -tags webkit2_41 ./...

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/universal
            name: darwin-universal
          - os: ubuntu-latest
            platform: linux/amd64
            name: linux-amd64
          - os: windows-latest
            platform: windows/amd64
            name: windows-amd64

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-tags: true
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pcscd libpcsclite-dev libgtk-3-dev libwebkit2gtk-4.1-dev

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Resolve version tag
      id: version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        fi

    - name: Import Apple Developer Certificate
      if: runner.os == 'macOS'
      env:
        MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
      run: |
        # Decodificar o .p12 do secret base64
        echo "$MACOS_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12

        # Criar keychain temporária e desbloquear
        security create-keychain -p "$MACOS_KEYCHAIN_PWD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" build.keychain
        security set-keychain-settings -lut 21600 build.keychain

        # Importar o certificado e permitir uso pelo codesign
        security import /tmp/certificate.p12 \
          -k build.keychain \
          -P "$MACOS_CERTIFICATE_PWD" \
          -T /usr/bin/codesign \
          -T /usr/bin/security

        # Liberar acesso sem prompt
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PWD" build.keychain

        # Confirmar que a identidade está disponível
        security find-identity -v -p codesigning build.keychain

        # Limpar o .p12 do disco
        rm -f /tmp/certificate.p12

    - name: Build with Wails
      shell: bash
      run: |
        EXTRA_TAGS=""
        if [ "${{ runner.os }}" = "Linux" ]; then
          EXTRA_TAGS="-tags webkit2_41"
        fi
        wails build -ldflags "-X main.version=${{ steps.version.outputs.tag }}" -platform ${{ matrix.platform }} $EXTRA_TAGS

    - name: Sign and notarize macOS app
      if: runner.os == 'macOS'
      env:
        MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      run: |
        brew install create-dmg librsvg

        # Gerar icns a partir do SVG
        mkdir -p iconset.iconset
        for size in 16 32 128 256 512; do
          rsvg-convert -w $size -h $size assets/icons/cfs-spool.svg -o iconset.iconset/icon_${size}x${size}.png
          double=$((size * 2))
          rsvg-convert -w $double -h $double assets/icons/cfs-spool.svg -o iconset.iconset/icon_${size}x${size}@2x.png
        done
        rsvg-convert -w 1024 -h 1024 assets/icons/cfs-spool.svg -o iconset.iconset/icon_512x512@2x.png
        iconutil -c icns iconset.iconset -o app.icns
        cp app.icns "build/bin/CFS Spool.app/Contents/Resources/app.icns"

        # Assinar com Developer ID + hardened runtime + entitlements
        codesign --force --deep --options runtime \
          --entitlements build/darwin/entitlements.plist \
          --sign "$MACOS_CERTIFICATE_NAME" \
          "build/bin/CFS Spool.app"

        # Verificar assinatura
        codesign --verify --deep --strict --verbose=2 "build/bin/CFS Spool.app"

        # Empacotar para notarização (sempre ditto, nunca zip)
        ditto -c -k --keepParent "build/bin/CFS Spool.app" "build/bin/cfs-spool-notarize.zip"

        # Submeter para notarização Apple
        xcrun notarytool submit "build/bin/cfs-spool-notarize.zip" \
          --apple-id "$APPLE_ID" \
          --team-id "$APPLE_TEAM_ID" \
          --password "$APPLE_APP_PASSWORD" \
          --wait

        # Anexar ticket de notarização ao .app
        xcrun stapler staple "build/bin/CFS Spool.app"

        # Validação final do Gatekeeper
        spctl -a -vvv -t install "build/bin/CFS Spool.app"

        # Limpar zip de notarização (só usado pra envio)
        rm -f "build/bin/cfs-spool-notarize.zip"

        # Gerar background do DMG
        rsvg-convert -w 600 -h 400 assets/dmg-background.svg -o dmg-background.png

        # Criar DMG com drag-to-Applications
        create-dmg \
          --volname "CFS Spool ${{ steps.version.outputs.tag }}" \
          --background "dmg-background.png" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "CFS Spool.app" 150 200 \
          --hide-extension "CFS Spool.app" \
          --app-drop-link 450 200 \
          "build/bin/cfs-spool.dmg" \
          "build/bin/CFS Spool.app"

        # Assinar e notarizar o DMG (evita warning ao abrir o .dmg baixado)
        codesign --force --sign "$MACOS_CERTIFICATE_NAME" "build/bin/cfs-spool.dmg"

        xcrun notarytool submit "build/bin/cfs-spool.dmg" \
          --apple-id "$APPLE_ID" \
          --team-id "$APPLE_TEAM_ID" \
          --password "$APPLE_APP_PASSWORD" \
          --wait

        xcrun stapler staple "build/bin/cfs-spool.dmg"

    - name: Cleanup keychain
      if: runner.os == 'macOS' && always()
      run: |
        security delete-keychain build.keychain || true

    - name: Upload macOS DMG
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v7
      with:
        name: cfs-spool-${{ matrix.name }}
        path: build/bin/cfs-spool.dmg

    - name: Upload build artifacts
      if: runner.os != 'macOS'
      uses: actions/upload-artifact@v7
      with:
        name: cfs-spool-${{ matrix.name }}
        path: build/bin/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-tags: true
        fetch-depth: 0

    - name: Resolve release tag
      id: tag
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          echo "name=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
        fi

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Fix Linux binary permissions
      run: |
        chmod +x artifacts/cfs-spool-linux-amd64/cfs-spool || true

    - name: Organize release files
      run: |
        mkdir -p release-files
        for dir in artifacts/cfs-spool-*/; do
          platform=$(basename "$dir")
          # macOS: DMG já é arquivo único, copiar direto
          if [[ "$platform" == *darwin* ]]; then
            cp "$dir"/*.dmg "release-files/${platform}.dmg"
          else
            cd "$dir"
            zip -r "../../release-files/${platform}.zip" .
            cd ../..
          fi
        done
        ls -la release-files/

    # Extrai a seção da versão atual do CHANGELOG.md (formato Keep a
    # Changelog) para usar como corpo da release. Se não houver entrada,
    # falha o passo — segundo a regra do projeto, toda release deve ter
    # uma entrada no CHANGELOG.md previamente preenchida.
    - name: Extract changelog section
      id: changelog
      shell: bash
      run: |
        TAG="${{ steps.tag.outputs.name }}"
        VERSION="${TAG#v}"
        SECTION=$(awk -v ver="$VERSION" '
          $0 ~ "^## \\["ver"\\]" { capture=1; next }
          capture && /^## \[/ { exit }
          capture { print }
        ' CHANGELOG.md)

        if [ -z "$(echo "$SECTION" | tr -d '[:space:]')" ]; then
          echo "::error::No CHANGELOG.md entry found for version $VERSION. Add it under '## [$VERSION] - YYYY-MM-DD' before tagging."
          exit 1
        fi

        {
          echo "section<<CHANGELOG_EOF"
          echo "$SECTION"
          echo "CHANGELOG_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.tag.outputs.name }}
        draft: false
        prerelease: false
        # generate_release_notes: false porque o corpo é montado a partir
        # do CHANGELOG.md curado, seguindo .github/RELEASE_TEMPLATE.md.
        generate_release_notes: false
        body: |
          ## CFS Spool ${{ steps.tag.outputs.name }}

          Native desktop application for reading and writing Creality CFS RFID tags.
          Built with Wails v2 + React + shadcn/ui.

          ## Downloads

          | Platform | File |
          |----------|------|
          | macOS Universal — Apple Silicon + Intel | `cfs-spool-darwin-universal.dmg` |
          | Linux x86_64 | `cfs-spool-linux-amd64.zip` |
          | Windows x86_64 | `cfs-spool-windows-amd64.zip` |

          ## Installation

          ### macOS
          Open the DMG and drag CFS Spool to **Applications**. The app is signed and notarized by Apple, so it opens without warnings.

          ### Linux / Windows
          Extract the ZIP file and run the `cfs-spool` binary.

          ## Requirements

          - **RFID Reader**: ACR122U or any compatible PC/SC reader.
          - **Linux**: `sudo apt install pcscd libpcsclite1`
          - **macOS / Windows**: PC/SC support is built in.

          ## What's Changed
          ${{ steps.changelog.outputs.section }}
        files: |
          release-files/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
